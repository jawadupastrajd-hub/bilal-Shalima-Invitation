name: Extract invitation zip

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract zip flat to repo root
        run: |
          ls -la
          test -f bilal-fatima-invitation.zip
          unzip -o bilal-fatima-invitation.zip
          cp -a bilal-fatima-invitation/. .
          rm -rf bilal-fatima-invitation bilal-fatima-invitation.zip
          ls -la
      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git diff --cached --quiet || git commit -m "Extract bilal-fatima-invitation.zip flat to repo root"
          git push
