name: Extract site zip
on:
  push:
    paths:
      - 'bilal-fatima-invitation.zip'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract zip flat to repo root
        run: |
          unzip -o bilal-fatima-invitation.zip
          rm -f bilal-fatima-invitation.zip
          rm -rf .github
      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git diff --cached --quiet || git commit -m "Extract latest site files"
          git push
