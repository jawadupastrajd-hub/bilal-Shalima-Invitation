name: Extract Shalima zip
on:
  push:
    branches: [main]
jobs:
  extract:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Extract zip flat to repo root and clean up
        run: |
          if [ ! -f bilal-shalima-invitation.zip ]; then
            echo "No zip found, nothing to do."
            exit 0
          fi
          unzip -o bilal-shalima-invitation.zip -d .
          rm bilal-shalima-invitation.zip
          rm -rf .github
      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract bilal-shalima-invitation.zip flat to repo root" || echo "Nothing to commit"
          git push
