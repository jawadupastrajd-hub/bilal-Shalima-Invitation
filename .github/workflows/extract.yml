name: Extract site files
on:
  push:
    paths:
      - 'bilal-fatima-invitation.zip'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip flat to repo root and clean up
        run: |
          unzip -o bilal-fatima-invitation.zip
          rm -f bilal-fatima-invitation.zip
          rm -rf .github
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Extract bilal-fatima-invitation.zip flat to repo root"
          git push
