name: Extract invitation zip
on:
  push:
    paths:
      - bilal-shalima-invitation.zip
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract zip flat to repo root
        run: |
          unzip -o bilal-shalima-invitation.zip -d .
          rm -f bilal-shalima-invitation.zip
          rm -rf .github
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update invitation: Muhammad Sajjad renamed to Muhammad Kashif" || echo "Nothing to commit"
          git push
