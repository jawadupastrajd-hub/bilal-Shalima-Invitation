name: Extract zip
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract zip flat to repo root and clean up
        run: |
          unzip -o bilal-shalima-invitation.zip -d .
          rm -f bilal-shalima-invitation.zip
          rm -rf .github
          ls -la
      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Extract bilal-shalima-invitation.zip flat to repo root" || echo "Nothing to commit"
          git push
